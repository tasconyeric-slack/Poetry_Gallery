name: Poetry Gallery checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cms.js
          node --check api/config.js
          node --check api/poetry.js
          node --check worker/index.js
      - name: Existing gallery smoke
        run: node scripts/smoke.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: D1 public release structure
        run: node scripts/mvp-check.mjs
      - name: Cloudflare public-read and security behavior tests
        run: node scripts/worker.test.mjs
      - name: D1 SQLite simulated-owner end-to-end CRUD and private images
        run: node scripts/d1-lifecycle.test.mjs
      - name: Collections and public share previews
        run: |
          node scripts/collections.test.mjs
          node scripts/share-preview.test.mjs
      - name: Archive retry, cover revision and recovery regressions
        run: node scripts/cloud-regression.test.mjs
      - name: Live deployed Cloudflare Worker HTTP smoke
        run: node scripts/live-smoke.mjs
      - name: Vercel config and origin checks
        run: node scripts/config.test.mjs

      - name: Private import SQL lifecycle
        run: node scripts/import-poems.test.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Mobile local authoring integration
        run: |
          node scripts/local-test-server.mjs &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://localhost:8080/')).ok)return}catch{}await new Promise(r=>setTimeout(r,300))}process.exit(1)})()"
          node scripts/browser-ui-share.test.mjs
          node scripts/browser-collections.test.mjs
          node scripts/visual-states.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-evidence
          path: |
            .qa/*.png
            docs/evidence/*.png
