name: Poetry Gallery checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cms.js
          node --check api/config.js
          node --check api/poetry.js
          node --check worker/index.js
      - name: Existing gallery smoke
        run: node scripts/smoke.mjs
      - name: D1 and phone SMS structure
        run: node scripts/mvp-check.mjs
      - name: Vercel config and origin checks
        run: node scripts/config.test.mjs
