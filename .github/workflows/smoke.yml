name: Poetry Gallery checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check cms.js
          node --check api/config.js
      - name: Check existing public gallery
        run: node scripts/smoke.mjs
      - name: Exercise Vercel runtime-config handler
        run: node scripts/config.test.mjs
      - name: Check publishing structure and security rules
        run: node scripts/mvp-check.mjs
